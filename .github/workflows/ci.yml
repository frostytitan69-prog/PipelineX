name: PipelineX CI/CD Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Lint, Test, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipelinex_user
          POSTGRES_PASSWORD: pipelinex_password
          POSTGRES_DB: pipelinex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Run Migrations
        env:
          DATABASE_URL: "postgresql://pipelinex_user:pipelinex_password@localhost:5432/pipelinex_db?schema=public"
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run ESLint
        run: npm run lint

      - name: Run Backend Test Suite
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: "postgresql://pipelinex_user:pipelinex_password@localhost:5432/pipelinex_db?schema=public"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          JWT_ACCESS_SECRET: "test-access-secret-1234567890"
          JWT_REFRESH_SECRET: "test-refresh-secret-1234567890"
        run: npm test

      - name: Build Express TypeScript Engine
        run: npm run build

  frontend-ci:
    name: Frontend CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript & ESLint
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Build Vite React Production Bundle
        env:
          VITE_API_URL: https://pipelinex-api.onrender.com
        run: npm run build
